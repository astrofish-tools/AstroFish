    <text x="38" y="323" fill="#fff" font-family="Arial,sans-serif" font-size="22">[SS 15s]     F 2.8     ISO 1600</text>
    <text x="38" y="351" fill="#d7dde8" font-family="Arial,sans-serif" font-size="18">SHOTS 20     DELAY 2s     INTERVAL 1s</text>
    <text x="38" y="378" fill="#9bb2d0" font-family="Arial,sans-serif" font-size="15">C1 STAR/CLEAN · C2/AEL MAG · FN SELECT · PLAY REVIEW · MENU BULB</text>
    <g transform="translate(905 290)">
      <rect width="190" height="102" rx="8" fill="#05070b" fill-opacity=".84" stroke="#60728e"/>
      <path d="M12 88 L18 86 L24 84 L30 80 L36 74 L42 66 L48 62 L54 69 L60 76 L66 81 L72 78 L78 67 L84 57 L90 52 L96 55 L102 65 L108 75 L114 82 L120 79 L126 67 L132 53 L138 42 L144 48 L150 60 L156 73 L162 81 L168 84 L176 86" fill="none" stroke="#e8edf5" stroke-width="2"/>
