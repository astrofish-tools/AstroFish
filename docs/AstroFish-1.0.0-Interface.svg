  <g font-family="Arial,sans-serif">
    <g transform="translate(42 520)"><circle cx="22" cy="22" r="20" fill="#ff9b34"/><text x="22" y="29" text-anchor="middle" font-size="20" font-weight="bold">1</text><text x="54" y="17" fill="#f2f5fa" font-size="18" font-weight="bold">Live view / 实时取景</text><text x="54" y="40" fill="#9eacc0" font-size="15">Full-screen composition and manual focus</text></g>
    <g transform="translate(410 520)"><circle cx="22" cy="22" r="20" fill="#ff9b34"/><text x="22" y="29" text-anchor="middle" font-size="20" font-weight="bold">2</text><text x="54" y="17" fill="#f2f5fa" font-size="18" font-weight="bold">Exposure controls / 曝光参数</text><text x="54" y="40" fill="#9eacc0" font-size="15">Shutter, aperture, ISO, sequence settings</text></g>
    <g transform="translate(800 520)"><circle cx="22" cy="22" r="20" fill="#ff9b34"/><text x="22" y="29" text-anchor="middle" font-size="20" font-weight="bold">3</text><text x="54" y="17" fill="#f2f5fa" font-size="18" font-weight="bold">Histogram / 直方图</text><text x="54" y="40" fill="#9eacc0" font-size="15">Preview guidance; playback confirms the photo</text></g>
    <rect x="42" y="603" width="1116" height="110" rx="12" fill="#111722" stroke="#26344a"/>
    <text x="66" y="637" fill="#ffb14a" font-size="18" font-weight="bold">C1 view cycle / 视图循环</text>
    <text x="66" y="671" fill="#e3e8ef" font-size="17">Normal + controls  →  Normal clean  →  Star View + controls  →  Star View clean  →  Normal + controls</text>
    <text x="66" y="697" fill="#99a9be" font-size="15">纯净取景会隐藏参数、状态、对焦小地图和直方图；再次按 C1 继续循环。</text>
