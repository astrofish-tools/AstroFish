  </defs>
  <rect width="1200" height="760" rx="24" fill="#080b11"/>
  <text x="48" y="54" fill="#f2f5fa" font-family="Arial,sans-serif" font-size="30" font-weight="bold">AstroFish 1.0</text>
  <text x="1152" y="52" text-anchor="end" fill="#8aa0bf" font-family="Arial,sans-serif" font-size="16">Sony α Camera App · by yxy</text>
  <g transform="translate(42 80)">
    <rect width="1116" height="410" rx="14" fill="url(#sky)" stroke="#34445f" stroke-width="2"/>
    <g fill="#dcecff">
      <circle cx="90" cy="66" r="2"/><circle cx="142" cy="114" r="1.7"/><circle cx="225" cy="48" r="2.4"/><circle cx="310" cy="92" r="1.8"/><circle cx="390" cy="52" r="1.6"/><circle cx="465" cy="132" r="2.5"/><circle cx="558" cy="70" r="1.6"/><circle cx="622" cy="112" r="2.2"/><circle cx="720" cy="44" r="2"/><circle cx="810" cy="96" r="1.5"/><circle cx="915" cy="62" r="2.4"/><circle cx="1030" cy="126" r="1.8"/>
    </g>
    <path d="M0 338 L120 276 L210 317 L320 236 L430 310 L548 226 L660 296 L770 212 L905 300 L1020 248 L1116 286 L1116 410 L0 410Z" fill="#05080d"/>
